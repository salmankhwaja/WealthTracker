<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PK Wealth</title>
  <meta name="description" content="Offline-first tracker for PSX, mutual funds, bank savings and gold with XIRR and CAGR.">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- No third-party scripts, fonts or trackers: everything below is served from this repo. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icons/icon.svg" alt="" width="26" height="26"><span>PK Wealth</span></div>
    <div class="asof" id="asof"></div>
  </header>

  <main>
    <section id="view-overview" class="view active" aria-label="Overview"></section>
    <section id="view-holdings" class="view" aria-label="Holdings"></section>
    <section id="view-update" class="view" aria-label="Update prices"></section>
    <section id="view-zakat" class="view" aria-label="Zakat"></section>
    <section id="view-data" class="view" aria-label="Data"></section>
  </main>

  <button class="fab" id="fab" aria-label="Add transaction">+</button>

  <nav class="tabbar" aria-label="Main">
    <button data-view="overview" class="active"><span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg></span>Overview</button>
    <button data-view="holdings"><span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></span>Holdings</button>
    <button data-view="update"><span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg></span>Update</button>
    <button data-view="zakat"><span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></span>Zakat</button>
    <button data-view="data"><span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg></span>Data</button>
  </nav>

  <!-- Add / edit transaction -->
  <dialog id="dlg-txn">
    <form method="dialog" id="form-txn">
      <h2 id="txn-title">Add transaction</h2>
      <label>Holding
        <select name="hid" id="txn-hid" required></select>
      </label>
      <label>Type
        <select name="type" id="txn-type" required></select>
      </label>
      <label>Date <input type="date" name="date" required></label>
      <label><span id="txn-amount-label">Amount (PKR)</span>
        <input type="number" name="amount" step="any" min="0" inputmode="decimal">
      </label>
      <label id="txn-units-wrap"><span id="txn-units-label">Units</span>
        <input type="number" name="units" step="any" min="0" inputmode="decimal">
      </label>
      <p class="hint" id="txn-hint"></p>
      <label>Note <input type="text" name="note" maxlength="200" autocomplete="off"></label>
      <div class="actions">
        <button type="button" class="ghost" data-close>Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Add / edit holding -->
  <dialog id="dlg-holding">
    <form method="dialog" id="form-holding">
      <h2 id="holding-title">New holding</h2>
      <label>Name <input type="text" name="name" required maxlength="80" placeholder="e.g. OGDC, Meezan Islamic Fund, HBL Savings" autocomplete="off"></label>
      <label>Asset class
        <select name="cls" id="holding-cls"></select>
      </label>
      <label>Symbol / account ref (optional) <input type="text" name="symbol" maxlength="40" autocomplete="off"></label>
      <label>Tracked by
        <select name="mode" id="holding-mode">
          <option value="units">Units × price (stocks, funds, gold)</option>
          <option value="value">Balance only (bank, deposits, other)</option>
        </select>
      </label>
      <label id="holding-unit-wrap">Unit name <input type="text" name="unit" maxlength="20" placeholder="shares / units / tola / gram"></label>
      <label>Notes <input type="text" name="notes" maxlength="200" autocomplete="off"></label>
      <div class="actions">
        <button type="button" class="ghost" data-close>Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Holding detail -->
  <dialog id="dlg-detail" class="sheet">
    <div id="detail-body"></div>
  </dialog>

  <!-- Zakat payment -->
  <dialog id="dlg-pay">
    <form method="dialog" id="form-pay">
      <h2>Record Zakat payment</h2>
      <label>Amount (PKR) <input type="number" name="amount" step="any" min="0" inputmode="decimal" required></label>
      <label>Date <input type="date" name="date" required></label>
      <label>Given to <select name="charity" id="pay-charity"></select></label>
      <label id="pay-other-wrap">Name <input type="text" name="other" maxlength="80" autocomplete="off"></label>
      <label>Note (receipt no., family member, etc.) <input type="text" name="note" maxlength="200" autocomplete="off"></label>
      <div class="actions">
        <button type="button" class="ghost" data-close>Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Backup passphrase -->
  <dialog id="dlg-pass">
    <form method="dialog" id="form-pass">
      <h2 id="pass-title">Backup passphrase</h2>
      <p class="hint" id="pass-hint"></p>
      <label>Passphrase <input type="password" name="pass" autocomplete="new-password" minlength="0"></label>
      <div class="actions">
        <button type="button" class="ghost" data-close>Cancel</button>
        <button type="submit" class="primary">OK</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="file-input" hidden accept=".csv,.json,text/csv,application/json">
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="finance.js"></script>
  <script src="zakat.js"></script>
  <script src="app.js"></script>
</body>
</html>
