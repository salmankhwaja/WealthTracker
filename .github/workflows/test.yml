name: test
# Free on public repos; kept lean anyway: skips data-only and docs-only changes,
# cancels a superseded run, and can never run longer than 5 minutes.
on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "**.md", "LICENSE", "icons/**"]
  pull_request:
    paths-ignore: ["data/**", "**.md", "LICENSE", "icons/**"]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tests/finance.test.js
      - run: node tests/zakat.test.js
      - run: node tests/feed.test.js
      - run: node tests/charges.test.js
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q cryptography==44.0.0
      - run: python3 tests/test_fetch_prices.py
